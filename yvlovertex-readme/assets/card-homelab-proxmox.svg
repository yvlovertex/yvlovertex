<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 396" width="500" height="396" role="img" aria-labelledby="t d"><title id="t">Homelab Proxmox</title><desc id="d">Homelab Proxmox (en production) : Infrastructure décrite en Ansible, supervisée par Prometheus / Grafana et déployée en continu par une CI/CD auto-hébergée. Stack : Proxmox VE, Ansible, Docker, GitHub Actions, Prometheus, Grafana. Infra, Projet perso, Solo, Juillet - septembre 2026. Dépôt GitHub overtexdev/homelab-proxmox-iac.</desc><style>@font-face{font-family:jmono;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:jsans;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:jsans;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:jmono;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:0}}.pop{animation:pop .55s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.cur{animation:blink 1.1s steps(1) infinite}text{font-variant-ligatures:none;font-kerning:normal}@media (prefers-reduced-motion:reduce){.pop,.cur{animation:none}}</style><g class="pop"><rect x="1" y="1" width="498" height="394" fill="#ffffff" stroke="#14110c" stroke-width="2"/><rect x="2" y="2" width="6" height="392" fill="#F59E0B"/><rect x="26.5" y="22.5" width="124" height="103" fill="#f3efe6" stroke="#14110c"/><g transform="translate(64 50) scale(2)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></g><text x="168" y="44" font-family="jmono,ui-monospace,monospace" font-size="14" font-weight="700" fill="#55503f">02</text><text x="168" y="78" font-family="jsans,system-ui,sans-serif"